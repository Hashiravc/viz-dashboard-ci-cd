name: CI/CD Dashboard Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: 🧪 Run Quality Checks & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite
        run: |
          pytest -v tests/

  docker-build:
    name: 🐳 Docker Container Build & Verify
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: viz-dashboard:latest

  deploy-cloud:
    name: 🚀 Automated Cloud Deployment Trigger
    needs: [lint-and-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Webhook / Validate GitOps Sync
        run: |
          echo "============================================="
          echo "CI/CD checks passed successfully!"
          echo "Triggering automated GitOps deployment sync..."
          echo "Cloud Provider: Streamlit Community Cloud / Render"
          echo "Target Repo: ${{ github.repository }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "============================================="
