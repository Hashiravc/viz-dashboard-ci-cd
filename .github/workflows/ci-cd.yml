name: CI/CD Multi-Tool Dashboard Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: 🧪 Run Quality Checks & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v tests/

      - name: Validate Application Code Syntax
        run: |
          python -m py_compile app.py data_loader.py

  docker-build:
    name: 🐳 Docker Container Build & Verify
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: viz-dashboard:latest

  deploy-cloud:
    name: 🚀 Automated Cloud Deployment Verification
    needs: [test-and-lint, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm GitOps Automation Readiness
        run: |
          echo "======================================================="
          echo "All CI/CD quality checks passed!"
          echo "Ready for zero-downtime deployment on Public Cloud / SaaS."
          echo "Target Provider: Streamlit Community Cloud / Render"
          echo "Target Repo: ${{ github.repository }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "======================================================="
